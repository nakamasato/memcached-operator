name: test

on:
  pull_request:
    # paths:
    #   - '**.go'
    #   - 'go.*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: make lint

      - name: test
        run: make test
